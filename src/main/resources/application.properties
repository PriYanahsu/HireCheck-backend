# Spring Boot API only — no embedded React SPA (frontend is separate / Vercel)

server.port=${PORT:8080}

# Load local .env from this project root (optional)
spring.config.import=optional:file:.env[.properties]

# Database — same as before (monolith defaults)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:hirecheck-db.chms4mak4fnk.ap-south-1.rds.amazonaws.com}:${PGPORT:5432}/${PGDATABASE:postgres}?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:${DB_PASSWORD:}}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT + CORS (FRONTEND_URL = Vercel origin in prod)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-days=7
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.public.url=${PUBLIC_URL:http://localhost:8080}

app.emailjs.public-key=${EMAILJS_PUBLIC_KEY:}
app.emailjs.private-key=${EMAILJS_PRIVATE_KEY:}
app.emailjs.service-id=${EMAILJS_SERVICE_ID:}
app.emailjs.template-id=${EMAILJS_TEMPLATE_ID:}
app.imagekit.private-key=${IMAGEKIT_PRIVATE_KEY:}
